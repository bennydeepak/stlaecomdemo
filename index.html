
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>St. Louis Regional Freightway &mdash; integrated priority projects dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
html, body { margin: 0; padding: 0; background: #F0F6F4; }
#root { min-height: 100vh; }
.boot { font: 13px/1.6 Inter, system-ui, sans-serif; color: #47706A; padding: 44px; letter-spacing: .04em; }

.app {
  --ink: #06302D;
  --slate: #47706A;
  --paper: #F0F6F4;
  --panel: #FFFFFF;
  --line: #CBE0DB;
  --hair: #E4EFEC;
  --wash: #E6F1EE;
  --pale: #C2DAD5;
  --teal: #0E7C72;
  --teal-mid: #17968B;
  --teal-lt: #4FBBAC;
  --teal-br: #4FD5C4;
  --deep: #06403C;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  display: flex; min-height: 100vh; background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.app *:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.app button { font: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1; }

/* rail */
.rail { width: 212px; flex: 0 0 212px; background: var(--ink); color: #DCEFEA; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { padding: 22px 20px 16px; display: flex; gap: 10px; align-items: flex-start; }
.brand-mark { width: 13px; height: 34px; margin-top: 2px; flex: 0 0 13px; background: repeating-linear-gradient(180deg, #4FD5C4 0 6px, transparent 6px 9px, #17968B 9px 15px, transparent 15px 18px); }
.brand-text { font-size: 15px; font-weight: 600; letter-spacing: -.005em; line-height: 1.2; }
.brand-text em { display: block; font-style: normal; font-size: 10.5px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; color: #7FB8AF; margin-top: 5px; }
.rail ul { list-style: none; margin: 6px 0 0; padding: 0; flex: 1; }
.rail li button { width: 100%; text-align: left; background: none; border: 0; color: #9CC7C0; padding: 9px 20px; font-size: 13.5px; border-left: 3px solid transparent; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rail li button:hover { color: #fff; background: rgba(255,255,255,.05); }
.rail li button.on { color: #fff; border-left-color: var(--teal-br); background: rgba(79,213,196,.14); }
.rail li button i { font-style: normal; font-size: 10px; color: #6FA79F; font-variant-numeric: tabular-nums; }
.rail-foot { padding: 13px 20px; border-top: 1px solid rgba(255,255,255,.14); display: flex; flex-direction: column; gap: 2px; font-size: 10.5px; color: #7FB8AF; font-variant-numeric: tabular-nums; }

/* shell */
.main { flex: 1; min-width: 0; }
.screen { max-width: 1120px; padding: 32px 40px 72px; }
.eyebrow { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--slate); font-variant-numeric: tabular-nums; }
.screen-head { margin-bottom: 24px; }
.screen-head h1 { font-size: 33px; font-weight: 600; letter-spacing: -.022em; margin: 4px 0 8px; }
.lede { max-width: 64ch; color: var(--slate); margin: 0; }

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 20px; }
.stat { background: var(--panel); padding: 15px 18px; }
.stat-label { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--slate); }
.stat-value { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 12px; color: var(--slate); margin-top: 2px; }

.panel { background: var(--panel); border: 1px solid var(--line); padding: 17px 20px 20px; margin-bottom: 20px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-head h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.panel-note { font-size: 12px; color: var(--slate); }
.two-col { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 20px; align-items: start; }
.two-col.wide-right { grid-template-columns: minmax(0,1fr) minmax(0,1.2fr); }

.ribbon { display: flex; width: 100%; background: var(--pale); }
.ribbon span { display: block; }
.tag { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; border: 1px solid; padding: 1px 5px; white-space: nowrap; }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-align: left; border-bottom: 1px solid transparent; }
.link:hover { color: var(--teal); border-bottom-color: var(--teal); }
.meta { font-size: 11px; color: var(--slate); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; margin-top: 10px; font-size: 11.5px; color: var(--slate); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.ghost { background: none; border: 1px solid var(--line); padding: 7px 12px; color: var(--slate); }
.ghost:hover { border-color: var(--slate); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { background: var(--panel); border: 0; padding: 6px 12px; font-size: 12.5px; color: var(--slate); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: #fff; }
.seg.small button { padding: 4px 10px; font-size: 11.5px; }
.field-label { display: block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); margin-bottom: 6px; }
.hint { font-size: 12px; color: var(--slate); margin: 8px 0 0; max-width: 48ch; }

/* charts */
.chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; }
.chart-title { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
.chart-sub { font-size: 11.5px; color: var(--slate); margin: 0 0 12px; }
.chart svg { width: 100%; display: block; overflow: visible; }
.axis-line { stroke: var(--line); stroke-width: 1; }
.grid-line { stroke: var(--hair); stroke-width: 1; }
.axis-text { font-size: 9.5px; fill: var(--slate); font-family: var(--body); font-variant-numeric: tabular-nums; }
.bar-label { font-size: 10.5px; fill: var(--ink); font-family: var(--body); }
.dot { cursor: pointer; }
.dot:hover { stroke: var(--ink); stroke-width: 1.5; }

/* overview lists */
.mode-grid { display: flex; flex-direction: column; gap: 9px; }
.mode-row { display: grid; grid-template-columns: 54px 1fr 78px; align-items: center; gap: 12px; }
.mode-name { font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--slate); }
.mode-bar { display: flex; height: 15px; background: var(--wash); }
.mode-val { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.split-row { display: flex; gap: 26px; margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.split { display: flex; align-items: baseline; gap: 7px; }
.split-key { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--slate); }
.split-val { font-size: 15px; font-variant-numeric: tabular-nums; }
.split-pct { font-size: 12px; color: var(--slate); font-variant-numeric: tabular-nums; }
.gap-list { list-style: none; margin: 0; padding: 0; }
.gap-item { width: 100%; display: grid; grid-template-columns: 1fr 140px 84px; align-items: center; gap: 14px; background: none; border: 0; border-bottom: 1px solid var(--hair); padding: 9px 0; text-align: left; }
.gap-item:hover { background: #F3F9F7; }
.gap-name { font-size: 13.5px; }
.gap-num { font-size: 13px; text-align: right; color: var(--teal); font-variant-numeric: tabular-nums; }

/* register */
.filters { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
.filters label { display: flex; flex-direction: column; gap: 4px; }
.filters label > span { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); }
.filters input, .filters select { font: inherit; padding: 6px 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-width: 142px; }
.table-wrap { border: 1px solid var(--line); background: var(--panel); overflow-x: auto; }
table.register { width: 100%; border-collapse: collapse; font-size: 13px; }
.register thead th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.register td { padding: 8px 12px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
.register tr:hover td { background: #F3F9F7; }
.register tr.child td.c-name { padding-left: 30px; }
.register tr.child { color: var(--slate); }
.c-num { text-align: right; font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.c-num.gap { color: var(--teal); }
.c-rib { width: 122px; }
.name-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.disc { width: 17px; height: 17px; line-height: 1; border: 1px solid var(--line); background: var(--panel); color: var(--slate); font-size: 12px; padding: 0; }
.disc-space { width: 17px; display: inline-block; }
.empty { padding: 26px 12px; color: var(--slate); text-align: center; }

/* scoring */
.weight-row { padding: 9px 0; border-bottom: 1px solid var(--hair); }
.weight-top { display: flex; justify-content: space-between; align-items: baseline; }
.weight-top label { font-size: 13px; }
.weight-num { font-size: 13px; font-variant-numeric: tabular-nums; }
.weight-row input[type=range] { width: 100%; accent-color: var(--teal); margin: 5px 0 2px; }
.weight-unit { font-size: 11.5px; color: var(--slate); }
.rank-list { list-style: none; margin: 0; padding: 0; max-height: 620px; overflow-y: auto; }
.rank-item { width: 100%; display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--hair); padding: 8px 0; text-align: left; }
.rank-item:hover { background: #F3F9F7; }
.rank-no { font-size: 12px; color: var(--slate); font-variant-numeric: tabular-nums; }
.rank-name { font-size: 13px; }
.rank-meta { display: block; font-size: 10.5px; color: var(--slate); margin-top: 1px; font-variant-numeric: tabular-nums; }
.rank-right { display: flex; align-items: center; gap: 8px; }
.rank-score { font-size: 13px; font-variant-numeric: tabular-nums; }
.move { font-size: 10.5px; font-variant-numeric: tabular-nums; }
.move.up { color: var(--deep); }
.move.down { color: #8FA9A4; }
.fragile { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--teal); border: 1px solid var(--teal); background: var(--wash); padding: 1px 4px; }

/* scenarios */
.controls { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
.budget { display: grid; grid-template-columns: 1fr 118px; grid-template-areas: "l l" "s o"; gap: 8px 14px; align-items: center; }
.budget .field-label { grid-area: l; margin: 0; }
.budget input { grid-area: s; width: 100%; accent-color: var(--deep); }
.budget output { grid-area: o; font-size: 19px; text-align: right; font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--slate); }
.scenario-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 18px; }
.pick-list { list-style: none; margin: 0; padding: 0; }
.pick-list li { display: grid; grid-template-columns: 16px 1fr 84px 56px 148px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--hair); color: var(--slate); }
.pick-list li.picked { color: var(--ink); }
.pick-mark { font-size: 10px; color: var(--pale); }
.pick-list li.picked .pick-mark { color: var(--teal-mid); }
.pick-name { font-size: 13px; }
.pick-num, .pick-eff { font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.pick-actions { display: flex; gap: 6px; justify-content: flex-end; }
.chip { background: none; border: 1px solid var(--line); padding: 2px 8px; font-size: 11px; color: var(--slate); }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.frontier svg { width: 100%; height: 150px; display: block; background: #F7FBFA; border: 1px solid var(--line); }
.frontier-axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--slate); margin-top: 5px; font-variant-numeric: tabular-nums; }

/* map */
.map-shell { display: grid; grid-template-columns: 232px 1fr; border: 1px solid var(--line); background: var(--panel); }
.map-side { border-right: 1px solid var(--line); padding: 14px 16px; }
.map-side h3 { font-size: 10.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--slate); margin: 0 0 10px; font-weight: 600; }
.map-side h3.later { margin-top: 20px; }
.layer { display: flex; gap: 9px; align-items: flex-start; padding: 6px 0; font-size: 12.5px; }
.layer input { margin-top: 3px; accent-color: var(--teal); }
.layer span em { display: block; font-style: normal; font-size: 10.5px; color: var(--slate); margin-top: 1px; }
.layer .src { display: inline-block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--pale); color: var(--slate); padding: 0 4px; margin-top: 3px; }
.layer .src.demo { border-color: var(--teal-lt); color: var(--teal); }
#mapview { height: 560px; width: 100%; background: var(--wash); }
.map-fallback { height: 560px; display: flex; align-items: center; justify-content: center; padding: 40px; text-align: center; background: repeating-linear-gradient(135deg, #F2F9F7 0 10px, #E6F1EE 10px 20px); }
.map-fallback div { max-width: 44ch; }
.map-fallback h3 { font-size: 15px; margin: 0 0 8px; font-weight: 600; letter-spacing: -.01em; text-transform: none; letter-spacing: normal; color: var(--ink); }
.map-fallback p { font-size: 12.5px; color: var(--slate); margin: 0 0 8px; }
.leaflet-container { font-family: var(--body); }
.leaflet-popup-content { margin: 12px 14px; font-size: 12.5px; }
.pop-t { font-weight: 600; display: block; margin-bottom: 4px; }
.pop-r { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; color: var(--slate); }

/* funding */
.fund-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.fund-table th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); font-weight: 500; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.fund-table td { padding: 8px 10px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
.fund-table tr:hover td { background: #F3F9F7; }
.pill { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; padding: 2px 7px; white-space: nowrap; border: 1px solid; }
.pill.awarded { background: var(--deep); border-color: var(--deep); color: #fff; }
.pill.applied { background: var(--wash); border-color: var(--teal-mid); color: var(--teal); }
.pill.eligible { border-color: var(--pale); color: var(--slate); }
.pill.ineligible { border-color: var(--hair); color: #9BB3AF; }
.match-cell { display: flex; align-items: center; gap: 8px; }
.match-bar { flex: 1; height: 6px; background: var(--wash); min-width: 42px; }
.match-bar span { display: block; height: 100%; background: var(--teal-lt); }

/* delivery */
.ms-list { list-style: none; margin: 0; padding: 0; }
.ms-list li { display: grid; grid-template-columns: 1fr 120px 190px; gap: 14px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--hair); }
.ms-name { font-size: 13px; }
.ms-agency { font-size: 11px; color: var(--slate); }
.ms-track { display: flex; gap: 4px; }
.ms-dot { width: 100%; height: 8px; background: var(--wash); }
.ms-dot.done { background: var(--teal-mid); }
.ms-dot.now { background: var(--deep); }
table.mini { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.mini td { padding: 7px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
.mini-a { font-weight: 500; }
.mini-b { font-size: 11.5px; color: var(--slate); width: 78px; font-variant-numeric: tabular-nums; }
.mini-c { color: var(--slate); }
.change-list { list-style: none; margin: 0; padding: 0; }
.change-list li { display: grid; grid-template-columns: 44px 66px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hair); }
.change-year { font-size: 12px; color: var(--slate); font-variant-numeric: tabular-nums; }
.change-type { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); padding-top: 2px; font-weight: 500; }
.change-body { display: flex; flex-direction: column; font-size: 12.5px; }
.change-body span { color: var(--slate); font-size: 12px; }

/* record drawer */
.scrim { position: fixed; inset: 0; background: rgba(6,48,45,.34); z-index: 900; }
.record { position: fixed; top: 0; right: 0; bottom: 0; width: min(470px, 94vw); z-index: 901; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 22px 26px 44px; }
.record-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
.record-head h2 { font-size: 21px; font-weight: 600; margin: 5px 0 4px; line-height: 1.2; letter-spacing: -.015em; }
.record-sponsor { font-size: 11.5px; color: var(--slate); font-variant-numeric: tabular-nums; }
.close { background: none; border: 0; font-size: 24px; line-height: 1; color: var(--slate); padding: 0 2px; }
.record-figure { height: 112px; margin: 18px 0 16px; border: 1px dashed var(--line); background: repeating-linear-gradient(135deg, #F2F9F7 0 9px, #E6F1EE 9px 18px); display: flex; align-items: center; justify-content: center; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #86ADA6; }
.record-money { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 8px; }
.record-money div { display: flex; flex-direction: column; }
.record-money > div > span { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--slate); }
.record-money strong { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.record-money .gap { color: var(--teal); }
.record h3 { font-size: 11px; letter-spacing: .11em; text-transform: uppercase; color: var(--slate); margin: 24px 0 10px; font-weight: 600; }
.score-grid { display: flex; flex-direction: column; gap: 7px; }
.score-row { display: grid; grid-template-columns: 1fr 92px 26px; gap: 10px; align-items: center; font-size: 12.5px; }
.score-bar { height: 7px; background: var(--wash); display: block; }
.score-bar span { display: block; height: 100%; background: var(--teal); }
.score-num { font-size: 11.5px; text-align: right; color: var(--slate); font-variant-numeric: tabular-nums; }
.score-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.score-total strong { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.record-ms { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.record-ms li { font-size: 11px; padding: 3px 8px; border: 1px solid var(--line); color: var(--slate); }
.record-ms li.done { background: var(--teal-mid); border-color: var(--teal-mid); color: #fff; }
.kid-list { list-style: none; margin: 0; padding: 0; }
.kid-list li { display: grid; grid-template-columns: 1fr 70px 62px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--hair); font-size: 12.5px; }
.kid-num { font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }
.record-foot { font-size: 11.5px; color: var(--slate); margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--line); }
.rec-kv { display: grid; grid-template-columns: 108px 1fr; gap: 5px 12px; font-size: 12.5px; }
.rec-kv dt { color: var(--slate); }
.rec-kv dd { margin: 0; font-variant-numeric: tabular-nums; }

/* hover tooltip */
.tip {
  position: fixed; z-index: 1200; pointer-events: none;
  background: #06302D; color: #E8F5F1; border: 1px solid #0E7C72;
  padding: 9px 11px; max-width: 268px; font-size: 12px; line-height: 1.42;
  box-shadow: 0 6px 20px rgba(6,48,45,.24);
}
.tip-t { display: block; font-weight: 600; font-size: 12.5px; color: #fff; margin-bottom: 5px; letter-spacing: -.005em; }
.tip-s { display: block; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: #7FB8AF; margin: -3px 0 6px; }
.tip-r { display: flex; justify-content: space-between; gap: 18px; font-variant-numeric: tabular-nums; }
.tip-r span:first-child { color: #9CC7C0; }
.tip-r span:last-child { color: #fff; }
.tip-rule { height: 1px; background: rgba(255,255,255,.16); margin: 6px 0; }
.tip-bar { height: 5px; background: rgba(255,255,255,.16); margin: 6px 0 2px; }
.tip-bar span { display: block; height: 100%; }
.tip-f { display: block; font-size: 10.5px; color: #7FB8AF; margin-top: 6px; }
.hit { cursor: default; }
.hit:hover { filter: brightness(1.08); }

/* ================================================================== *
 *  4. HELPERS AND THE SCORING ENGINE                                  *
 * ================================================================== */

const SCALE = ["#06403C", "#0E7C72", "#17968B", "#4FBBAC", "#8FD3C8", "#C2DAD5", "#E6F1EE"];

const money = (m) => {
  if (m === 0) return "TBD";
  if (m >= 1000) return "$" + (m / 1000).toFixed(2) + "B";
  if (m >= 100) return "$" + m.toFixed(0) + "M";
  return "$" + m.toFixed(1) + "M";
};
const gapOf = (p) => Math.max(0, p.cost - p.funded);

const PHASE_COLOR = {
  Complete: "#06403C", Construction: "#0E7C72", Funded: "#17968B",
  Partial: "#4FBBAC", Unfunded: "#7FA7A1", Study: "#9BB3AF",
};

function scoreOf(p, weights) {
  let s = 0, tw = 0;
  CRITERIA.forEach((c, i) => { s += (p.m[i] || 0) * weights[c.key]; tw += weights[c.key]; });
  return tw === 0 ? 0 : s / tw;
}
function valueIndex(p, weights) {
  const g = gapOf(p);
  if (g <= 0) return scoreOf(p, weights);
  return (scoreOf(p, weights) * 100) / Math.max(g, 1);
}
function rankValue(p, weights, basis) {
  return basis === "benefit" ? scoreOf(p, weights) : valueIndex(p, weights);
}

/* Knapsack over unfunded gaps, $5M granularity. */
function selectPortfolio(items, budgetM, weights) {
  const G = 5, B = Math.max(0, Math.floor(budgetM / G));
  const costs = items.map((p) => Math.max(1, Math.round(gapOf(p) / G)));
  const vals = items.map((p) => scoreOf(p, weights));
  const dp = new Float64Array(B + 1);
  const keep = [];
  for (let i = 0; i < items.length; i++) {
    const row = new Uint8Array(B + 1), ci = costs[i], vi = vals[i];
    for (let b = B; b >= ci; b--) {
      const cand = dp[b - ci] + vi;
      if (cand > dp[b] + 1e-9) { dp[b] = cand; row[b] = 1; }
    }
    keep.push(row);
  }
  let b = B; const chosen = new Set();
  for (let i = items.length - 1; i >= 0; i--) {
    if (keep[i] && keep[i][b]) { chosen.add(items[i].id); b -= costs[i]; }
  }
  return { chosen };
}

function milestoneIndex(p) {
  switch (p.phase) {
    case "Complete": return 8;
    case "Construction": return 7;
    case "Funded": return 5;
    case "Partial": return 4;
    case "Unfunded": return 2;
    default: return 1;
  }
}

/* ================================================================== *
 *  6. HOVER TOOLTIP INFRASTRUCTURE                                    *
 * ================================================================== */

const TipCtx = React.createContext(null);
const useTip = () => React.useContext(TipCtx);

function TipProvider({ children }) {
  const [tip, setTip] = useState(null);
  const api = useMemo(() => ({
    show: (node, e) => setTip({ node, x: e.clientX, y: e.clientY }),
    move: (e) => setTip((t) => (t ? { ...t, x: e.clientX, y: e.clientY } : t)),
    hide: () => setTip(null),
  }), []);
  let style = null;
  if (tip) {
    const vw = typeof window !== "undefined" ? window.innerWidth : 1200;
    const vh = typeof window !== "undefined" ? window.innerHeight : 800;
    const flipX = tip.x > vw - 300;
    const flipY = tip.y > vh - 190;
    style = {
      left: flipX ? undefined : tip.x + 14,
      right: flipX ? vw - tip.x + 14 : undefined,
      top: flipY ? undefined : tip.y + 14,
      bottom: flipY ? vh - tip.y + 14 : undefined,
    };
  }
  return (
    <TipCtx.Provider value={api}>
      {children}
      {tip && <div className="tip" style={style} role="tooltip">{tip.node}</div>}
    </TipCtx.Provider>
  );
}

/* Attach hover handlers to any SVG shape. `build` returns the tooltip body. */
function hoverProps(tip, build) {
  if (!tip) return {};
  return {
    onMouseEnter: (e) => tip.show(build(), e),
    onMouseMove: (e) => tip.move(e),
    onMouseLeave: () => tip.hide(),
  };
}

const TipRow = ({ k, v }) => <span className="tip-r"><span>{k}</span><span>{v}</span></span>;

/* Full project card, used by the scatter and anywhere a project is hovered. */
function ProjectTip({ p, weights, rank, extra }) {
  const g = gapOf(p);
  return (
    <>
      <span className="tip-t">{p.name}</span>
      <span className="tip-s">{p.state === "MO-IL" ? "Bi-state" : p.state} &middot; {p.mode} &middot; {p.phase}</span>
      <TipRow k="Total cost" v={money(p.cost)} />
      <TipRow k="Committed" v={money(p.funded)} />
      <TipRow k="Gap" v={g > 0 ? money(g) : "none"} />
      <span className="tip-bar">
        <span style={{ width: (p.funded / (p.cost || 1)) * 100 + "%", background: "#4FD5C4" }} />
      </span>
      <div className="tip-rule" />
      <TipRow k="Composite score" v={scoreOf(p, weights).toFixed(1)} />
      {rank ? <TipRow k="Rank" v={"#" + rank} /> : null}
      <TipRow k="Programme" v={p.grant} />
      <TipRow k="Application" v={p.grantStatus} />
      <TipRow k="Next step" v={p.milestone} />
      <TipRow k="Due" v={p.msDate} />
      {extra}
      <span className="tip-f">{p.agency} &middot; select to open the record</span>
    </>
  );
}

/* Horizontal stacked bars.
   rows: [{label, total, parts:[{name,v,color}], tip?}]  tip() overrides the body. */
function StackedBars({ rows, maxV, fmt, unit }) {
  const tip = useTip();
  const rowH = 26, padL = 92, padR = 60, W = 460;
  const H = rows.length * rowH + 18;
  const inner = W - padL - padR;
  const ticks = 4;
  return (
    <svg viewBox={"0 0 " + W + " " + H} role="img">
      {Array.from({ length: ticks + 1 }).map((_, i) => {
        const x = padL + (inner / ticks) * i;
        return (
          <g key={i}>
            <line className="grid-line" x1={x} y1={0} x2={x} y2={rows.length * rowH} />
            <text className="axis-text" x={x} y={H - 4} textAnchor="middle">{fmt((maxV / ticks) * i)}</text>
          </g>
        );
      })}
      {rows.map((r, i) => {
        let acc = 0;
        return (
          <g key={r.label} transform={"translate(0 " + i * rowH + ")"}>
            <text className="bar-label" x={padL - 8} y={rowH / 2 + 4} textAnchor="end">{r.label}</text>
            {r.parts.map((pt, j) => {
              const w = (pt.v / maxV) * inner, x = padL + acc;
              acc += w;
              if (pt.v <= 0) return null;
              const body = () => r.tip ? r.tip(pt) : (
                <>
                  <span className="tip-t">{r.full || r.label}</span>
                  <span className="tip-s">{pt.name}</span>
                  <TipRow k={unit || "Value"} v={pt.v > 0 ? fmt(pt.v) : "\u2014"} />
                  <TipRow k="Share of row" v={((pt.v / (r.total || 1)) * 100).toFixed(0) + "%"} />
                  <div className="tip-rule" />
                  {r.parts.map((o) => <TipRow key={o.name} k={o.name} v={o.v > 0 ? fmt(o.v) : "\u2014"} />)}
                  <TipRow k="Row total" v={fmt(r.total)} />
                  {r.foot ? <span className="tip-f">{r.foot}</span> : null}
                </>
              );
              return (
                <rect key={j} className="hit" x={x} y={5} width={Math.max(w, 0)} height={rowH - 12}
                  fill={pt.color} {...hoverProps(tip, body)} />
              );
            })}
            <text className="axis-text" x={W - padR + 6} y={rowH / 2 + 4}>{fmt(r.total)}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* Benefit against cost. Bubble area is the unfunded gap. */
function Scatter({ items, weights, ranks, onOpen }) {
  const tip = useTip();
  const W = 460, H = 250, padL = 40, padB = 30, padT = 10, padR = 12;
  const iw = W - padL - padR, ih = H - padB - padT;
  const maxC = Math.max(...items.map((p) => p.cost), 1);
  const lx = (c) => padL + (Math.log10(Math.max(c, 1) + 1) / Math.log10(maxC + 1)) * iw;
  const scores = items.map((p) => scoreOf(p, weights));
  const lo = Math.min(...scores) - 3, hi = Math.max(...scores) + 3;
  const ly = (s) => padT + ih - ((s - lo) / (hi - lo)) * ih;
  const maxG = Math.max(...items.map(gapOf), 1);
  const marks = [10, 100, 1000];
  return (
    <svg viewBox={"0 0 " + W + " " + H} role="img">
      {[0, .25, .5, .75, 1].map((f, i) => (
        <line key={i} className="grid-line" x1={padL} y1={padT + ih * f} x2={W - padR} y2={padT + ih * f} />
      ))}
      {marks.map((m) => (
        <g key={m}>
          <line className="grid-line" x1={lx(m)} y1={padT} x2={lx(m)} y2={padT + ih} />
          <text className="axis-text" x={lx(m)} y={H - 12} textAnchor="middle">{money(m)}</text>
        </g>
      ))}
      <text className="axis-text" x={padL} y={padT + 4} textAnchor="start">{hi.toFixed(0)}</text>
      <text className="axis-text" x={padL} y={padT + ih} textAnchor="start">{lo.toFixed(0)}</text>
      <line className="axis-line" x1={padL} y1={padT} x2={padL} y2={padT + ih} />
      {items.map((p, i) => {
        const r = 3 + Math.sqrt(gapOf(p) / maxG) * 11;
        return (
          <circle key={p.id} className="dot" cx={lx(p.cost)} cy={ly(scores[i])} r={r}
            fill={PHASE_COLOR[p.phase]} fillOpacity=".72" stroke="#fff" strokeWidth="1"
            onClick={() => { tip && tip.hide(); onOpen(p.id); }}
            {...hoverProps(tip, () => (
              <ProjectTip p={p} weights={weights} rank={ranks ? ranks[p.id] : null}
                extra={<TipRow k="Benefit per $100M gap" v={valueIndex(p, weights).toFixed(1)} />} />
            ))} />
        );
      })}
    </svg>
  );
}

/* Score composition: stacked contribution of each criterion. */
function Composition({ items, weights, ranks, onOpen }) {
  const tip = useTip();
  const tw = Object.values(weights).reduce((a, b) => a + b, 0) || 1;
  const rowH = 24, padL = 128, W = 460, H = items.length * rowH + 16;
  const inner = W - padL - 40;
  const maxTotal = Math.max(...items.map((p) => scoreOf(p, weights)), 1);
  return (
    <svg viewBox={"0 0 " + W + " " + H} role="img">
      {items.map((p, i) => {
        let acc = 0;
        const totalScore = scoreOf(p, weights);
        return (
          <g key={p.id} transform={"translate(0 " + i * rowH + ")"}>
            <text className="bar-label" x={padL - 8} y={rowH / 2 + 4} textAnchor="end"
              {...hoverProps(tip, () => <ProjectTip p={p} weights={weights} rank={ranks ? ranks[p.id] : null} />)}>
              {p.name.length > 24 ? p.name.slice(0, 23) + "\u2026" : p.name}
            </text>
            {CRITERIA.map((c, j) => {
              const contrib = (p.m[j] * weights[c.key]) / tw;
              const w = (contrib / maxTotal) * inner, x = padL + acc;
              acc += w;
              if (w <= 0.4) return null;
              return (
                <rect key={c.key} className="hit" x={x} y={5} width={w} height={rowH - 12}
                  fill={SCALE[j % SCALE.length]}
                  onClick={() => { tip && tip.hide(); onOpen && onOpen(p.id); }}
                  {...hoverProps(tip, () => (
                    <>
                      <span className="tip-t">{p.name}</span>
                      <span className="tip-s">{c.label}</span>
                      <TipRow k="Raw criterion value" v={p.m[j] + " / 100"} />
                      <TipRow k="Weight" v={weights[c.key] + " of " + tw} />
                      <TipRow k="Contribution" v={contrib.toFixed(1) + " pts"} />
                      <TipRow k="Share of score" v={((contrib / (totalScore || 1)) * 100).toFixed(0) + "%"} />
                      <div className="tip-rule" />
                      <TipRow k="Composite score" v={totalScore.toFixed(1)} />
                      <TipRow k="Cost" v={money(p.cost)} />
                      <TipRow k="Gap" v={gapOf(p) > 0 ? money(gapOf(p)) : "none"} />
                      <span className="tip-f">{c.unit}</span>
                    </>
                  ))} />
              );
            })}
            <text className="axis-text" x={padL + acc + 5} y={rowH / 2 + 4}>{totalScore.toFixed(0)}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* Donut. parts: [{name, v, color, items?}] */
function Donut({ parts, centreLabel, centreValue, fmt, unit }) {
  const tip = useTip();
  const f = fmt || ((v) => String(v));
  const total = parts.reduce((a, p) => a + p.v, 0) || 1;
  const R = 74, r = 46, cx = 92, cy = 92;
  let a0 = -Math.PI / 2;
  const segs = parts.map((p) => {
    const a1 = a0 + (p.v / total) * Math.PI * 2;
    const big = a1 - a0 > Math.PI ? 1 : 0;
    const d = [
      "M", cx + R * Math.cos(a0), cy + R * Math.sin(a0),
      "A", R, R, 0, big, 1, cx + R * Math.cos(a1), cy + R * Math.sin(a1),
      "L", cx + r * Math.cos(a1), cy + r * Math.sin(a1),
      "A", r, r, 0, big, 0, cx + r * Math.cos(a0), cy + r * Math.sin(a0), "Z",
    ].join(" ");
    a0 = a1;
    return { p, d };
  });
  return (
    <svg viewBox="0 0 184 184" style={{ maxWidth: 200, margin: "0 auto" }} role="img">
      {segs.map(({ p, d }) => (
        <path key={p.name} className="hit" d={d} fill={p.color}
          {...hoverProps(tip, () => (
            <>
              <span className="tip-t">{p.name}</span>
              <span className="tip-s">{unit || "Share of total"}</span>
              <TipRow k="Value" v={f(p.v)} />
              <TipRow k="Share" v={((p.v / total) * 100).toFixed(1) + "%"} />
              <TipRow k="Total" v={f(total)} />
              {p.items && p.items.length ? (
                <>
                  <div className="tip-rule" />
                  {p.items.slice(0, 5).map((n) => <TipRow key={n} k={"\u2014"} v={n} />)}
                  {p.items.length > 5 ? <span className="tip-f">and {p.items.length - 5} more</span> : null}
                </>
              ) : null}
            </>
          ))} />
      ))}
      <text x={cx} y={cy - 2} textAnchor="middle" style={{ fontSize: 19, fontWeight: 600, fill: "#06302D" }}
        className="num">{centreValue}</text>
      <text x={cx} y={cy + 14} textAnchor="middle" style={{ fontSize: 8.5, fill: "#47706A", letterSpacing: ".1em" }}>
        {centreLabel}
      </text>
    </svg>
  );
}

function Overview({ tops, weights, ranks, onOpen }) {
  const total = tops.reduce((a, p) => a + p.cost, 0);
  const funded = tops.reduce((a, p) => a + p.funded, 0);
  const complete = tops.filter((p) => p.phase === "Complete").reduce((a, p) => a + p.cost, 0);
  const gap = total - funded;

  const modeRows = MODES.map((m) => {
    const set = tops.filter((p) => p.mode === m);
    const c = set.reduce((a, p) => a + p.cost, 0);
    const g = set.reduce((a, p) => a + gapOf(p), 0);
    return {
      label: m, full: m + " projects", total: c,
      foot: set.length + " projects \u00b7 " + set.filter((p) => gapOf(p) > 0).length + " with an open gap",
      parts: [
        { name: "Committed", v: c - g, color: "#17968B" },
        { name: "Gap", v: g, color: "#C2DAD5" },
      ],
    };
  }).sort((a, b) => b.total - a.total);
  const maxMode = Math.max(...modeRows.map((r) => r.total), 1);

  const phaseParts = PHASES.map((ph) => {
    const set = tops.filter((p) => p.phase === ph);
    return {
      name: ph, v: set.reduce((a, p) => a + p.cost, 0),
      color: PHASE_COLOR[ph], items: set.map((p) => p.name),
    };
  }).filter((p) => p.v > 0);

  const topScored = [...tops].sort((a, b) => scoreOf(b, weights) - scoreOf(a, weights)).slice(0, 8);
  const biggestGaps = [...tops].sort((a, b) => gapOf(b) - gapOf(a)).slice(0, 8);

  return (
    <div className="screen">
      <header className="screen-head">
        <div className="eyebrow">Portfolio</div>
        <h1>2026 priority projects</h1>
        <p className="lede">
          Twenty-nine projects across the bi-state region. The bar under every
          project shows what is built, what is committed, and what is still being
          asked for.
        </p>
      </header>

      <div className="stat-row">
        <Stat label="Total investment" value={money(total)} sub="29 projects" />
        <Stat label="Completed" value={money(complete)} sub="6 projects delivered" />
        <Stat label="Committed, not complete" value={money(funded - complete)} sub="Programmed by sponsors" />
        <Stat label="Remaining gap" value={money(gap)} sub={((gap / total) * 100).toFixed(0) + "% of programme"} />
      </div>

      <div className="chart-grid">
        <ChartFrame
          title="Investment by mode"
          sub="Committed against the remaining gap"
          legend={[{ label: "Committed", color: "#17968B" }, { label: "Gap", color: "#C2DAD5" }]}
        >
          <StackedBars rows={modeRows} maxV={maxMode} fmt={money} unit="Investment" />
        </ChartFrame>

        <ChartFrame
          title="Programme by delivery status"
          sub="Share of total cost"
          legend={phaseParts.map((p) => ({ label: p.name, color: p.color }))}
        >
          <Donut parts={phaseParts} centreValue={money(total)} centreLabel="TOTAL" fmt={money} unit="Share of programme cost" />
        </ChartFrame>

        <ChartFrame
          title="Benefit against cost"
          sub="Bubble size is the unfunded gap. Hover for the project, select to open the record."
          legend={PHASES.filter((p) => tops.some((t) => t.phase === p)).map((p) => ({ label: p, color: PHASE_COLOR[p] }))}
        >
          <Scatter items={tops} weights={weights} ranks={ranks} onOpen={onOpen} />
        </ChartFrame>

        <ChartFrame
          title="What drives the top scores"
          sub="Weighted contribution of each criterion. Hover a band for the underlying value."
          legend={CRITERIA.slice(0, 4).map((c, i) => ({ label: c.label.split(" ")[0], color: SCALE[i] }))}
        >
          <Composition items={topScored} weights={weights} ranks={ranks} onOpen={onOpen} />
        </ChartFrame>
      </div>

      <div className="panel">
        <div className="panel-head">
          <h2>Largest unfunded gaps</h2>
          <span className="panel-note">Select a project to open its record</span>
        </div>
        <ul className="gap-list">
          {biggestGaps.map((p) => (
            <li key={p.id}>
              <button className="gap-item" onClick={() => onOpen(p.id)}>
                <span className="gap-name">{p.name}</span>
                <Ribbon project={p} height={5} weights={weights} rank={ranks ? ranks[p.id] : null} />
                <span className="gap-num">{money(gapOf(p))}</span>
              </button>
            </li>
          ))}
        </ul>
      </div>
    </div>
  );
}

  const toggle = (id) => {

  return (
    <div className="screen">

        <div className="eyebrow">Database</div>

        <p className="lede">

          and coordinates. Sub-projects that carry their own funding status sit

/* ================================================================== *
 *  9. SCORING AND RANKING ENGINE                                      *
 * ================================================================== */

function Scoring({ weights, setWeights, basis, setBasis, tops, onOpen, baseRanks }) {
  const tip = useTip();
  const total = Object.values(weights).reduce((a, b) => a + b, 0);
  const ordered = [...tops].sort((a, b) => rankValue(b, weights, basis) - rankValue(a, weights, basis));

  const stress = useMemo(() => {
    const counts = {}; const N = 120;
    for (let r = 0; r < N; r++) {
      const w = {};
      CRITERIA.forEach((c) => { w[c.key] = Math.max(0, weights[c.key] + (Math.random() * 20 - 10)); });
      [...tops].sort((a, b) => rankValue(b, w, basis) - rankValue(a, w, basis))
        .slice(0, 10).forEach((p) => { counts[p.id] = (counts[p.id] || 0) + 1; });
    }
    const out = {};
    Object.keys(counts).forEach((k) => { out[k] = counts[k] / N; });
    return out;
  }, [weights, tops, basis]);

  return (
    <div className="screen">
      <header className="screen-head">
        <div className="eyebrow">Method</div>
        <h1>Scoring and ranking engine</h1>
        <p className="lede">
          The Task 5 selection criteria with adjustable weights. Composite score
          and rank recalculate as weights move. Positions that survive only one
          weighting are flagged, so the committee can see which parts of the
          ranking are robust.
        </p>
      </header>

      <div className="two-col wide-right">
        <div>
          <div className="panel">
            <div className="panel-head">
              <h2>Criterion weights</h2>
              <span className="panel-note">Sum {total}</span>
            </div>
            {CRITERIA.map((c) => (
              <div key={c.key} className="weight-row">
                <div className="weight-top">
                  <label htmlFor={"w-" + c.key}>{c.label}</label>
                  <span className="weight-num">{weights[c.key]}</span>
                </div>
                <input id={"w-" + c.key} type="range" min="0" max="40" value={weights[c.key]}
                  onChange={(e) => setWeights({ ...weights, [c.key]: Number(e.target.value) })} />
                <div className="weight-unit">{c.unit}</div>
              </div>
            ))}
            <div style={{ marginTop: 16 }}>
              <span className="field-label">Rank projects by</span>
              <div className="seg">
                <button className={basis === "benefit" ? "on" : ""} onClick={() => setBasis("benefit")}>
                  Benefit score
                </button>
                <button className={basis === "efficiency" ? "on" : ""} onClick={() => setBasis("efficiency")}>
                  Benefit per $100M of gap
                </button>
              </div>
              <p className="hint">
                Ranking on benefit alone puts the megaprojects on top. Ranking on
                benefit per dollar still being asked for moves small, ready
                projects up. This is the trade-off to settle before the weights.
              </p>
            </div>
          </div>
        </div>

        <div className="panel">
          <div className="panel-head">
            <h2>Composite ranking</h2>
            <span className="panel-note">Movement shown against the adopted 2026 weights</span>
          </div>
          <ol className="rank-list">
            {ordered.map((p, i) => {
              const move = (baseRanks[p.id] || 0) - (i + 1);
              const stability = stress[p.id];
              return (
                <li key={p.id}>
                  <button className="rank-item" onClick={() => onOpen(p.id)}
                    {...hoverProps(tip, () => (
                      <ProjectTip p={p} weights={weights} rank={i + 1}
                        extra={<TipRow k="Benefit per $100M gap" v={valueIndex(p, weights).toFixed(1)} />} />
                    ))}>
                    <span className="rank-no">{String(i + 1).padStart(2, "0")}</span>
                    <span className="rank-name">{p.name}
                      <span className="rank-meta">{money(p.cost)} &middot; {p.mode} &middot; {p.state} &middot; {p.agency}</span>
                    </span>
                    <span className="rank-right">
                      <span className="rank-score">{rankValue(p, weights, basis).toFixed(1)}</span>
                      {move !== 0 && (
                        <span className={"move " + (move > 0 ? "up" : "down")}>
                          {move > 0 ? "\u25B2" : "\u25BC"} {Math.abs(move)}
                        </span>
                      )}
                      {i < 10 && stability !== undefined && stability < 0.7 && (
                        <span className="fragile" title="Leaves the top ten under small weight changes">fragile</span>
                      )}
                    </span>
                  </button>
                </li>
              );
            })}
          </ol>
        </div>
      </div>
    </div>
  );
}

/* ================================================================== *
 *  10. SCENARIOS                                                      *
 * ================================================================== */

function Optimizer({ tops, weights, onOpen }) {
  const tip = useTip();
  const candidates = useMemo(() => tops.filter((p) => gapOf(p) > 0 && p.phase !== "Study"), [tops]);
  const maxGap = candidates.reduce((a, p) => a + gapOf(p), 0);
  const [budget, setBudget] = useState(1500);
  const [balance, setBalance] = useState(false);
  const [locked, setLocked] = useState(() => new Set());
  const [excluded, setExcluded] = useState(() => new Set());

  const run = useCallback((b) => {
    const pool = candidates.filter((p) => !excluded.has(p.id) && !locked.has(p.id));
    const lockCost = candidates.filter((p) => locked.has(p.id)).reduce((a, p) => a + gapOf(p), 0);
    const remaining = Math.max(0, b - lockCost);
    const chosen = new Set(locked);
    if (!balance) {
      selectPortfolio(pool, remaining, weights).chosen.forEach((id) => chosen.add(id));
    } else {
      selectPortfolio(pool.filter((p) => p.state === "MO"), remaining * 0.5, weights).chosen.forEach((id) => chosen.add(id));
      selectPortfolio(pool.filter((p) => p.state !== "MO"), remaining * 0.5, weights).chosen.forEach((id) => chosen.add(id));
    }
    return chosen;
  }, [candidates, weights, balance, locked, excluded]);

  const chosen = useMemo(() => run(budget), [run, budget]);
  const selected = candidates.filter((p) => chosen.has(p.id));
  const spend = selected.reduce((a, p) => a + gapOf(p), 0);

  const frontier = useMemo(() => {
    const pts = [];
    for (let i = 0; i <= 16; i++) {
      const b = (maxGap / 16) * i;
      const c = run(b);
      pts.push({ b, v: candidates.filter((p) => c.has(p.id)).reduce((a, p) => a + scoreOf(p, weights), 0) });
    }
    return pts;
  }, [run, maxGap, candidates, weights]);

  const maxV = Math.max(...frontier.map((p) => p.v), 1);
  const W = 560, H = 170;
  const path = frontier.map((p, i) => `${i === 0 ? "M" : "L"} ${(p.b / maxGap) * W} ${H - (p.v / maxV) * H}`).join(" ");
  const curV = selected.reduce((a, p) => a + scoreOf(p, weights), 0);
  const cur = { x: (Math.min(budget, maxGap) / maxGap) * W, y: H - (curV / maxV) * H };

  const toggleSet = (set, setter, id) => {
    const n = new Set(set);
    n.has(id) ? n.delete(id) : n.add(id);
    setter(n);
  };

  return (
    <div className="screen">
      <header className="screen-head">
        <div className="eyebrow">Scenario</div>
        <h1>Budget scenarios</h1>
        <p className="lede">
          Given an envelope, the tool picks the set of unfunded gaps that buys the
          most scored benefit. Lock a project in where a commitment already
          exists, or exclude one that is not deliverable in the period.
        </p>
      </header>

      <div className="panel">
        <div className="controls">
          <label className="budget">
            <span className="field-label">Advocacy envelope</span>
            <input type="range" min="0" max={Math.round(maxGap)} step="25" value={budget}
              onChange={(e) => setBudget(Number(e.target.value))} />
            <output>{money(budget)}</output>
          </label>
          <label className="check">
            <input type="checkbox" checked={balance} onChange={(e) => setBalance(e.target.checked)} />
            <span>Split the envelope evenly between Missouri and Illinois</span>
          </label>
        </div>

        <div className="frontier">
          <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" role="img" aria-label="Benefit against budget">
            <path d={path} fill="none" stroke="#0E7C72" strokeWidth="2" vectorEffect="non-scaling-stroke" />
            <line x1={cur.x} y1="0" x2={cur.x} y2={H} stroke="#06403C" strokeWidth="1"
              strokeDasharray="4 4" vectorEffect="non-scaling-stroke" />
            <circle cx={cur.x} cy={cur.y} r="4" fill="#06403C" />
            {frontier.map((pt, i) => {
              const seg = W / frontier.length;
              const picked = candidates.filter((p) => run(pt.b).has(p.id));
              const prev = i > 0 ? frontier[i - 1] : null;
              return (
                <rect key={i} className="hit" x={i * seg} y={0} width={seg} height={H}
                  fill="transparent"
                  onClick={() => setBudget(Math.round(pt.b))}
                  {...hoverProps(tip, () => (
                    <>
                      <span className="tip-t">{money(pt.b)} envelope</span>
                      <span className="tip-s">Point on the benefit curve</span>
                      <TipRow k="Projects funded" v={picked.length + " of " + candidates.length} />
                      <TipRow k="Gap covered" v={money(picked.reduce((a, p) => a + gapOf(p), 0))} />
                      <TipRow k="Benefit purchased" v={pt.v.toFixed(0) + " pts"} />
                      {prev ? (
                        <TipRow k="Gained on last step"
                          v={"+" + (pt.v - prev.v).toFixed(0) + " pts / " + money(pt.b - prev.b)} />
                      ) : null}
                      <div className="tip-rule" />
                      {picked.slice(0, 4).map((p) => (
                        <TipRow key={p.id} k={p.name.length > 22 ? p.name.slice(0, 21) + "\u2026" : p.name}
                          v={money(gapOf(p))} />
                      ))}
                      {picked.length > 4 ? <span className="tip-f">and {picked.length - 4} more</span> : null}
                      <span className="tip-f">Select to set the envelope here</span>
                    </>
                  ))} />
              );
            })}
          </svg>
          <div className="frontier-axis">
            <span>{money(0)}</span>
            <span>Benefit purchased as the envelope grows</span>
            <span>{money(maxGap)}</span>
          </div>
        </div>

        <div className="scenario-summary">
          <Stat label="Projects selected" value={selected.length + " of " + candidates.length} />
          <Stat label="Committed in scenario" value={money(spend)} sub={money(Math.max(0, budget - spend)) + " unspent"} />
          <Stat label="Gap left on the table" value={money(maxGap - spend)} />
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <h2>Selection</h2>
          <span className="panel-note">Sorted by benefit per dollar of gap</span>
        </div>
        <ul className="pick-list">
          {[...candidates].sort((a, b) => valueIndex(b, weights) - valueIndex(a, weights)).map((p) => {
            const inSet = chosen.has(p.id);
            return (
              <li key={p.id} className={inSet ? "picked" : ""}>
                <span className="pick-mark" aria-hidden="true">{inSet ? "\u25CF" : "\u25CB"}</span>
                <button className="pick-name link" onClick={() => onOpen(p.id)}>{p.name}</button>
                <span className="pick-num">{money(gapOf(p))}</span>
                <span className="pick-eff">{valueIndex(p, weights).toFixed(1)}</span>
                <span className="pick-actions">
                  <button className={locked.has(p.id) ? "chip on" : "chip"}
                    onClick={() => toggleSet(locked, setLocked, p.id)}>Lock in</button>
                  <button className={excluded.has(p.id) ? "chip on" : "chip"}
                    onClick={() => toggleSet(excluded, setExcluded, p.id)}>Exclude</button>
                </span>
              </li>
            );
          })}
        </ul>
      </div>
    </div>
  );
}

/* ================================================================== *
 *  11. GIS MAP VIEWER                                                 *
 * ================================================================== */

const LAYER_DEFS = [
  { key:"projects",  label:"Scored and ranked projects", note:"Marker size follows the composite score", src:"Register", demo:false },
  { key:"corridors", label:"Freight volumes",            note:"Line weight follows truck AADT (Task 3)", src:"Demo data", demo:true },
  { key:"gateways",  label:"Commodity flows",            note:"Circle area follows annual tonnage (Task 3)", src:"Demo data", demo:true },
  { key:"isa",       label:"Industrial Site Areas",      note:"Simplified illustrative extents (Task 4)", src:"Demo data", demo:true },
  { key:"hotspots",  label:"Gaps and high-crash sites",  note:"Truck-involved crash concentrations (Task 5)", src:"Demo data", demo:true },
];

function MapView({ tops, weights, ranks, onOpen }) {
  const host = useRef(null);
  const mapRef = useRef(null);
  const groups = useRef({});
  const [ready, setReady] = useState(null); // null = checking, true/false = result
  const [on, setOn] = useState({ projects:true, corridors:true, gateways:false, isa:true, hotspots:false });
  const [basemap, setBasemap] = useState("light");

  useEffect(() => {
    if (typeof L === "undefined" || !host.current) { setReady(false); return; }
    let map;
    try {
      map = L.map(host.current, { scrollWheelZoom: false, zoomControl: true }).setView([38.65, -90.22], 9);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO', maxZoom: 18, subdomains: "abcd",
      }).addTo(map);
    } catch (e) { setReady(false); return; }
    mapRef.current = map;

    const g = {};

    /* --- Industrial Site Areas --- */
    g.isa = L.layerGroup(ISA_AREAS.map((a) =>
      L.rectangle(a.box, { color:"#0E7C72", weight:1, fillColor:"#4FBBAC", fillOpacity:.18, dashArray:"4 3" })
        .bindPopup('<span class="pop-t">' + a.name + '</span><div class="pop-r"><span>Industrial Site Area</span><span>' + a.acres.toLocaleString() + ' ac</span></div>')
    ));

    /* --- Corridor truck volumes --- */
    g.corridors = L.layerGroup(CORRIDORS.map((c) =>
      L.polyline(c.path, { color:"#06403C", weight: 1.5 + (c.aadtt / 15200) * 7, opacity:.62 })
        .bindPopup('<span class="pop-t">' + c.name + '</span><div class="pop-r"><span>Truck AADT</span><span>' + c.aadtt.toLocaleString() + '</span></div>')
    ));

    /* --- Commodity flow gateways --- */
    g.gateways = L.layerGroup(GATEWAYS.map((t) =>
      L.circleMarker(t.ll, {
        radius: 5 + Math.sqrt(t.mt) * 5, color:"#0E7C72", weight:1.5,
        fillColor:"#8FD3C8", fillOpacity:.62,
      }).bindPopup('<span class="pop-t">' + t.name + '</span><div class="pop-r"><span>Annual throughput</span><span>' + t.mt + ' Mt</span></div>')
    ));

    /* --- Crash concentrations --- */
    g.hotspots = L.layerGroup(HOTSPOTS.map((h) =>
      L.circleMarker(h.ll, {
        radius: 4 + (h.crashes / 51) * 9, color:"#06302D", weight:1,
        fillColor:"#06302D", fillOpacity:.34,
      }).bindPopup('<span class="pop-t">' + h.name + '</span><div class="pop-r"><span>Truck-involved crashes, 3 yr</span><span>' + h.crashes + '</span></div>')
    ));

    /* --- Scored projects --- */
    const scores = tops.map((p) => scoreOf(p, weights));
    const lo = Math.min(...scores), hi = Math.max(...scores);
    g.projects = L.layerGroup(tops.map((p, i) => {
      const t = hi === lo ? .5 : (scores[i] - lo) / (hi - lo);
      const mk = L.circleMarker([p.lat, p.lng], {
        radius: 5 + t * 9,
        color: "#FFFFFF", weight: 1.5,
        fillColor: PHASE_COLOR[p.phase], fillOpacity: .92,
      });
      mk.bindPopup(
        '<span class="pop-t">' + p.name + '</span>' +
        '<div class="pop-r"><span>Rank</span><span>' + (ranks[p.id] || "\u2014") + '</span></div>' +
        '<div class="pop-r"><span>Score</span><span>' + scores[i].toFixed(1) + '</span></div>' +
        '<div class="pop-r"><span>Cost</span><span>' + money(p.cost) + '</span></div>' +
        '<div class="pop-r"><span>Gap</span><span>' + (gapOf(p) > 0 ? money(gapOf(p)) : "none") + '</span></div>' +
        '<div class="pop-r"><span>Sponsor</span><span>' + p.agency + '</span></div>'
      );
      mk.on("dblclick", () => onOpen(p.id));
      return mk;
    }));

    groups.current = g;
    Object.keys(g).forEach((k) => { if (on[k]) g[k].addTo(map); });
    setReady(true);
    setTimeout(() => map.invalidateSize(), 60);

    return () => { map.remove(); mapRef.current = null; groups.current = {}; };
    // eslint-disable-next-line
  }, []);

  // toggle layers
  useEffect(() => {
    const map = mapRef.current, g = groups.current;
    if (!map || !g.projects) return;
    Object.keys(g).forEach((k) => {
      if (on[k] && !map.hasLayer(g[k])) g[k].addTo(map);
      if (!on[k] && map.hasLayer(g[k])) map.removeLayer(g[k]);
    });
  }, [on, ready]);

  // rescale project markers when weights change
  useEffect(() => {
    const g = groups.current;
    if (!g.projects) return;
    const scores = tops.map((p) => scoreOf(p, weights));
    const lo = Math.min(...scores), hi = Math.max(...scores);
    g.projects.getLayers().forEach((mk, i) => {
      const t = hi === lo ? .5 : (scores[i] - lo) / (hi - lo);
      mk.setRadius(5 + t * 9);
    });
  }, [weights, tops, ready]);

  const flip = (k) => setOn({ ...on, [k]: !on[k] });

  return (
    <div className="screen">
      <header className="screen-head">
        <div className="eyebrow">Geography</div>
        <h1>GIS map viewer</h1>
        <p className="lede">
          Scored project points over the freight context layers. Select a marker
          for its score and funding position, or double-click it to open the full
          record.
        </p>
      </header>

      <div className="map-shell">
        <div className="map-side">
          <h3>Layers</h3>
          {LAYER_DEFS.map((l) => (
            <label key={l.key} className="layer">
              <input type="checkbox" checked={on[l.key]} onChange={() => flip(l.key)} disabled={ready === false} />
              <span>{l.label}<em>{l.note}</em>
                <span className={l.demo ? "src demo" : "src"}>{l.src}</span>
              </span>
            </label>
          ))}
          <h3 className="later">Reading the map</h3>
          <p className="hint" style={{ margin: 0 }}>
            Project marker size follows the composite score from the scoring
            engine, so moving a weight there changes the map here. Colour follows
            delivery status.
          </p>
        </div>

        {ready === false ? (
          <div className="map-fallback">
            <div>
              <h3>Map layer not available in this demo</h3>
              <p>
                The mapping library could not be loaded, which usually means the
                browser has no route to the tile and script host. Everything else
                in the dashboard works without it.
              </p>
              <p>
                In the built system this panel holds the project points over the
                Industrial Site Area boundaries, corridor truck volumes, commodity
                flow gateways, and crash concentrations, served from the region's
                own ArcGIS services rather than a public tile host.
              </p>
            </div>
          </div>
        ) : (
          <div id="mapview" ref={host} />
        )}
      </div>

      <Legend items={[
        ...PHASES.filter((p) => tops.some((t) => t.phase === p)).map((p) => ({ label: p, color: PHASE_COLOR[p] })),
        { label: "Industrial Site Area", color: "#4FBBAC" },
      ]} />

      <div className="panel" style={{ marginTop: 20 }}>
        <div className="panel-head">
          <h2>Layer provenance</h2>
          <span className="panel-note">What is real and what is placeholder</span>
        </div>
        <p className="hint" style={{ maxWidth: "72ch" }}>
          Project names, costs, funding status and sponsors follow the published
          2026 list; coordinates are approximate corridor midpoints. The Industrial
          Site Area extents, corridor volumes, gateway tonnages and crash counts
          are demo geometry standing in for the Task 3 data acquisition and the
          Task 4 ISA update. None of them should be read as regional figures.
        </p>
      </div>
    </div>
  );
}

function Funding({ tops, onOpen }) {
  const [status, setStatus] = useState("");
  const rows = tops.filter((p) => !status || p.grantStatus === status);

  const byProgram = GRANT_PROGRAMS.map((g) => {
    const set = tops.filter((p) => p.grant === g.name);
    const part = (st) => set.filter((p) => p.grantStatus === st).reduce((a, p) => a + (st === "awarded" ? p.funded : gapOf(p)), 0);
    const aw = part("awarded"), ap = part("applied"), el = part("eligible");
    return {
      label: g.name.replace(" / INFRA", "").replace("Port Infrastructure Development", "Port (PIDP)").replace("Bridge Investment Program", "Bridge (BIP)").replace("Airport Improvement Program", "Airport (AIP)"),
      full: g.name,
      total: aw + ap + el,
      foot: set.length + " projects \u00b7 " + g.cycle + " cycle \u00b7 " + g.match,
      parts: [
        { name:"Awarded", v: aw, color:"#06403C" },
        { name:"Applied", v: ap, color:"#17968B" },
        { name:"Eligible, not applied", v: el, color:"#C2DAD5" },
      ] };
  }).filter((r) => r.total > 0).sort((a, b) => b.total - a.total);
  const maxProg = Math.max(...byProgram.map((r) => r.total), 1);

  const counts = ["awarded", "applied", "eligible"].map((s, i) => {
    const set = tops.filter((p) => p.grantStatus === s);
    return { name: s, v: set.length, color: SCALE[i * 2], items: set.map((p) => p.name) };
  });

  const matchNeed = tops.filter((p) => p.grantStatus !== "awarded")
    .reduce((a, p) => a + gapOf(p) * (p.match / 100), 0);

  return (
    <div className="screen">
      <header className="screen-head">
        <div className="eyebrow">Funding</div>
        <h1>Grant eligibility and match tracker</h1>
        <p className="lede">
          Each project against the federal or state programme it is eligible for,
          where it sits in that programme's cycle, and the non-federal match the
          region has to find if the application succeeds.
        </p>
      </header>

      <div className="stat-row">
        <Stat label="Awarded" value={counts[0].v + " projects"} sub="Funds committed" />
        <Stat label="Applications live" value={counts[1].v + " projects"} sub="Awaiting decision" />
        <Stat label="Eligible, not applied" value={counts[2].v + " projects"} sub="Pipeline candidates" />
        <Stat label="Match exposure" value={money(matchNeed)} sub="Non-federal share on open gaps" />
      </div>

      <div className="chart-grid">
        <ChartFrame
          title="Pipeline by programme"
          sub="Dollars awarded, applied for, and eligible but not yet applied. Hover a band for the programme."
          legend={[{ label:"Awarded", color:"#06403C" }, { label:"Applied", color:"#17968B" }, { label:"Eligible", color:"#C2DAD5" }]}
        >
          <StackedBars rows={byProgram} maxV={maxProg} fmt={money} unit="Dollars" />
        </ChartFrame>

        <ChartFrame title="Where the projects sit" sub="Count by application status"
          legend={counts.map((c) => ({ label: c.name, color: c.color }))}>
          <Donut parts={counts} centreValue={String(tops.length)} centreLabel="PROJECTS" fmt={(v) => v + " projects"} unit="Application status" />
        </ChartFrame>
      </div>

      <div className="panel">
        <div className="panel-head">
          <h2>Project by project</h2>
          <div className="seg small">
            <button className={status === "" ? "on" : ""} onClick={() => setStatus("")}>All</button>
            {["awarded", "applied", "eligible"].map((s) => (
              <button key={s} className={status === s ? "on" : ""} onClick={() => setStatus(s)}>
                {s[0].toUpperCase() + s.slice(1)}
              </button>
            ))}
          </div>
        </div>
        <div className="table-wrap" style={{ border: 0 }}>
          <table className="fund-table">
            <thead><tr>
              <th>Project</th><th>Eligible programme</th><th>Status</th>
              <th style={{ textAlign: "right" }}>Gap</th>
              <th style={{ width: 150 }}>Local match required</th>
            </tr></thead>
            <tbody>
              {rows.map((p) => (
                <tr key={p.id}>
                  <td><button className="link" onClick={() => onOpen(p.id)}>{p.name}</button></td>
                  <td>{p.grant}</td>
                  <td><span className={"pill " + p.grantStatus}>{p.grantStatus}</span></td>
                  <td className="c-num">{gapOf(p) > 0 ? money(gapOf(p)) : "\u2014"}</td>
                  <td>
                    <span className="match-cell">
                      <span className="match-bar"><span style={{ width: p.match + "%" }} /></span>
                      <span className="num" style={{ fontSize: 11.5 }}>
                        {p.match}% &middot; {money(gapOf(p) * p.match / 100)}
                      </span>
                    </span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <h2>Programme cycles</h2>
          <span className="panel-note">Illustrative timing, confirmed each year</span>
        </div>
        <table className="mini"><tbody>
          {GRANT_PROGRAMS.map((g) => (
            <tr key={g.name}>
              <td className="mini-a">{g.name}</td>
              <td className="mini-b">{g.cycle}</td>
              <td className="mini-c">{g.match}</td>
            </tr>
          ))}
        </tbody></table>
      </div>
    </div>
  );
}

/* ================================================================== *
 *  13. IMPLEMENTATION AND REPORTING TRACKER                           *
 * ================================================================== */

function Tracker({ tops, weights, onOpen }) {
  const tip = useTip();
  const [filter, setFilter] = useState("");
  const shown = tops.filter((p) => !filter || p.state === filter);

  const phaseCounts = MILESTONES.map((m, i) => {
    const set = tops.filter((p) => milestoneIndex(p) === i + 1);
    return {
      label: m, full: "Projects at: " + m, total: set.length,
      foot: set.length ? set.slice(0, 4).map((p) => p.name.split(",")[0]).join("; ") : "No projects at this stage",
      parts: [{ name: m, v: set.length, color: SCALE[Math.min(i, 5)] }],
    };
  });
  const maxPhase = Math.max(...phaseCounts.map((p) => p.total), 1);

  const agencies = {};
  tops.forEach((p) => { agencies[p.agency] = (agencies[p.agency] || 0) + gapOf(p); });
  const agencyRows = Object.keys(agencies).map((a) => {
    const set = tops.filter((p) => p.agency === a);
    return {
      label: a.length > 16 ? a.slice(0, 15) + "\u2026" : a,
      full: a, total: agencies[a],
      foot: set.length + " projects \u00b7 " + set.filter((p) => gapOf(p) > 0).length + " with an open gap",
      parts: [{ name: "Unfunded gap carried", v: agencies[a], color: "#17968B" }],
    };
  }).sort((a, b) => b.total - a.total).slice(0, 8);
  const maxAg = Math.max(...agencyRows.map((r) => r.total), 1);

  return (
    <div className="screen">
      <header className="screen-head">
        <div className="eyebrow">Delivery</div>
        <h1>Implementation and reporting</h1>
        <p className="lede">
          Where every project sits in the delivery sequence, which agency owns the
          next step and when it is due, and what moved since last year's list.
        </p>
      </header>

      <div className="chart-grid">
        <ChartFrame title="Projects by delivery stage" sub="Count at each milestone">
          <StackedBars rows={phaseCounts} maxV={maxPhase} fmt={(v) => v.toFixed(0)} unit="Projects" />
        </ChartFrame>
        <ChartFrame title="Open gap by responsible agency" sub="Unfunded dollars each sponsor is carrying">
          <StackedBars rows={agencyRows} maxV={maxAg} fmt={money} unit="Open gap" />
        </ChartFrame>
      </div>

      <div className="panel">
        <div className="panel-head">
          <h2>Delivery position and next milestone</h2>
          <div className="seg small">
            <button className={filter === "" ? "on" : ""} onClick={() => setFilter("")}>All</button>
            {STATES.map((s) => (
              <button key={s} className={filter === s ? "on" : ""} onClick={() => setFilter(s)}>
                {s === "MO-IL" ? "Bi-state" : s}
              </button>
            ))}
          </div>
        </div>
        <ul className="ms-list">
          {shown.map((p) => {
            const idx = milestoneIndex(p);
            return (
              <li key={p.id}>
                <span>
                  <button className="ms-name link" onClick={() => onOpen(p.id)}>{p.name}</button>
                  <span className="ms-agency" style={{ display: "block" }}>{p.agency}</span>
                </span>
                <span className="num" style={{ fontSize: 11.5, color: "#47706A" }}>
                  {p.milestone}<br />{p.msDate}
                </span>
                <span className="ms-track"
                  {...hoverProps(tip, () => (
                    <ProjectTip p={p} weights={weights}
                      extra={<TipRow k="Current stage" v={MILESTONES[idx - 1]} />} />
                  ))}>
                  {MILESTONES.map((m, i) => (
                    <span key={m} className={"ms-dot " + (i === idx - 1 ? "now" : i < idx ? "done" : "")} title={m} />
                  ))}
                </span>
              </li>
            );
          })}
        </ul>
      </div>

      <div className="panel">
        <div className="panel-head">
          <h2>What changed</h2>
          <span className="panel-note">Frozen at each annual adoption</span>
        </div>
        <ul className="change-list">
          {CHANGES.map((c, i) => (
            <li key={i}>
              <span className="change-year">{c.y}</span>
              <span className="change-type">{c.t}</span>
              <span className="change-body"><strong>{c.p}</strong><span>{c.n}</span></span>
            </li>
          ))}
        </ul>
      </div>
    </div>
  );
}

/* ================================================================== *
 *  14. PROJECT RECORD                                                 *
 * ================================================================== */

function Record({ project, kids, weights, rank, onClose, onOpen }) {
  useEffect(() => {
    const k = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [onClose]);
  if (!project) return null;
  return (
    <>
      <div className="scrim" onClick={onClose} />
      <aside className="record" role="dialog" aria-label={project.name}>
        <div className="record-head">
          <div>
            <div className="eyebrow">
              {project.state === "MO-IL" ? "Bi-state" : project.state} &middot; {project.mode}
              {rank ? " \u00b7 Rank " + rank : ""}
            </div>
            <h2>{project.name}</h2>
            <div className="record-sponsor">{project.agency} &middot; {project.lat.toFixed(4)}, {project.lng.toFixed(4)}</div>
          </div>
          <button className="close" onClick={onClose} aria-label="Close record">&times;</button>
        </div>

        <div className="record-figure" aria-hidden="true"><span>Fact sheet imagery</span></div>

        <div className="record-money">
          <div><span>Total cost</span><strong>{money(project.cost)}</strong></div>
          <div><span>Committed</span><strong>{money(project.funded)}</strong></div>
          <div><span>Gap</span><strong className="gap">{gapOf(project) > 0 ? money(gapOf(project)) : "None"}</strong></div>
        </div>
        <Ribbon project={project} height={10} />

        <h3>Funding position</h3>
        <dl className="rec-kv">
          <dt>Programme</dt><dd>{project.grant}</dd>
          <dt>Status</dt><dd><span className={"pill " + project.grantStatus}>{project.grantStatus}</span></dd>
          <dt>Local match</dt><dd>{project.match}% &middot; {money(gapOf(project) * project.match / 100)}</dd>
          <dt>Next milestone</dt><dd>{project.milestone}, {project.msDate}</dd>
        </dl>

        <h3>Scorecard</h3>
        <div className="score-grid">
          {CRITERIA.map((c, i) => (
            <div key={c.key} className="score-row">
              <span>{c.label}</span>
              <span className="score-bar"><span style={{ width: project.m[i] + "%" }} /></span>
              <span className="score-num">{project.m[i]}</span>
            </div>
          ))}
        </div>
        <div className="score-total">
          <span>Weighted composite score</span>
          <strong>{scoreOf(project, weights).toFixed(1)}</strong>
        </div>

        <h3>Delivery position</h3>
        <ol className="record-ms">
          {MILESTONES.map((m, i) => (
            <li key={m} className={i < milestoneIndex(project) ? "done" : ""}>{m}</li>
          ))}
        </ol>

        {kids.length > 0 && (
          <>
            <h3>Sub-projects</h3>
            <ul className="kid-list">
              {kids.map((k) => (
                <li key={k.id}>
                  <button className="link" onClick={() => onOpen(k.id)}>{k.name}</button>
                  <Ribbon project={k} height={4} />
                  <span className="kid-num">{money(k.cost)}</span>
                </li>
              ))}
            </ul>
          </>
        )}

        <p className="record-foot">
          Criterion values, grant status and milestone dates in this demo are
          placeholders. In the built system they come from the sponsor data call
          and state performance datasets, with source and vintage shown against
          each value.
        </p>
      </aside>
    </>
  );
}

/* ================================================================== *
 *  15. SHELL                                                          *
 * ================================================================== */

const NAV = [
  { k:"overview",  label:"Portfolio" },
  { k:"register",  label:"Register" },
  { k:"scoring",   label:"Scoring" },
  { k:"map",       label:"Map" },
  { k:"funding",   label:"Funding" },
  { k:"delivery",  label:"Delivery" },
  { k:"scenarios", label:"Scenarios" },
];

function App() {
  const [view, setView] = useState("overview");
  const [openId, setOpenId] = useState(null);
  const [filters, setFilters] = useState({ q:"", mode:"", state:"", phase:"" });
  const [basis, setBasis] = useState("benefit");
  const [weights, setWeights] = useState(() => {
    const w = {}; CRITERIA.forEach((c) => { w[c.key] = c.w; }); return w;
  });
  const baseWeights = useMemo(() => {
    const w = {}; CRITERIA.forEach((c) => { w[c.key] = c.w; }); return w;
  }, []);

  const tops = useMemo(() => DATA.filter((p) => !p.parent), []);

  const rankMap = (w, b) => {
    const m = {};
    [...tops].sort((a, c) => rankValue(c, w, b) - rankValue(a, w, b))
      .forEach((p, i) => { m[p.id] = i + 1; });
    return m;
  };
  const ranks = useMemo(() => rankMap(weights, basis), [weights, basis, tops]);
  const baseRanks = useMemo(() => rankMap(baseWeights, basis), [baseWeights, basis, tops]);

  const filtered = useMemo(() => {
    const q = filters.q.trim().toLowerCase();
    const match = (p) =>
      (!q || p.name.toLowerCase().includes(q) || (p.sponsor || "").toLowerCase().includes(q)) &&
      (!filters.mode || p.mode === filters.mode) &&
      (!filters.state || p.state === filters.state) &&
      (!filters.phase || p.phase === filters.phase);
    const keep = new Set();
    DATA.forEach((p) => { if (match(p)) { keep.add(p.id); if (p.parent) keep.add(p.parent); } });
    return DATA.filter((p) => keep.has(p.id));
  }, [filters]);

  const open = DATA.find((p) => p.id === openId) || null;
  const kids = open ? DATA.filter((k) => k.parent === open.id) : [];

  const counts = {
    register: DATA.length, scoring: tops.length, map: tops.length,
    funding: tops.length, delivery: tops.length,
  };

  return (
    <TipProvider>
    <div className="app">
      <nav className="rail">
        <div className="brand">
          <span className="brand-mark" aria-hidden="true" />
          <span className="brand-text">Regional Freightway<em>Integrated dashboard</em></span>
        </div>
        <ul>
          {NAV.map((n) => (
            <li key={n.k}>
              <button className={view === n.k ? "on" : ""} onClick={() => setView(n.k)}>
                {n.label}{counts[n.k] ? <i>{counts[n.k]}</i> : null}
              </button>
            </li>
          ))}
        </ul>
        <div className="rail-foot"><span>2026 list</span><span>Demo data</span></div>
      </nav>

      <main className="main">
        {view === "overview"  && <Overview tops={tops} weights={weights} ranks={ranks} onOpen={setOpenId} />}
        {view === "register"  && <Register rows={filtered} filters={filters} setFilters={setFilters}
                                   onOpen={setOpenId} weights={weights} ranks={ranks} />}
        {view === "scoring"   && <Scoring weights={weights} setWeights={setWeights} basis={basis}
                                   setBasis={setBasis} tops={tops} onOpen={setOpenId} baseRanks={baseRanks} />}
        {view === "map"       && <MapView tops={tops} weights={weights} ranks={ranks} onOpen={setOpenId} />}
        {view === "funding"   && <Funding tops={tops} onOpen={setOpenId} />}
        {view === "delivery"  && <Tracker tops={tops} weights={weights} onOpen={setOpenId} />}
        {view === "scenarios" && <Optimizer tops={tops} weights={weights} onOpen={setOpenId} />}
      </main>

      <Record project={open} kids={kids} weights={weights} rank={open && !open.parent ? ranks[open.id] : null}
        onClose={() => setOpenId(null)} onOpen={setOpenId} />
    </div>
    </TipProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
