/* ------------------------------------------------------------------ */
/*  Helpers                                                            */
/* ------------------------------------------------------------------ */

const money = (m) => {
  if (m === 0) return "TBD";
  if (m >= 1000) return "$" + (m / 1000).toFixed(2) + "B";
  if (m >= 100) return "$" + m.toFixed(0) + "M";
  return "$" + m.toFixed(1) + "M";
};

const gapOf = (p) => Math.max(0, p.cost - p.funded);

const PHASE_COLOR = {
  Complete: "#06403C",
  Construction: "#0E7C72",
  Funded: "#17968B",
  Partial: "#4FBBAC",
  Unfunded: "#7FA7A1",
  Study: "#9BB3AF",
};

function scoreOf(p, weights) {
  let s = 0, tw = 0;
  CRITERIA.forEach((c, i) => {
    s += (p.m[i] || 0) * weights[c.key];
    tw += weights[c.key];
  });
  return tw === 0 ? 0 : s / tw;
}

// Benefit relative to the money still being asked for.
function valueIndex(p, weights, denominator) {
  const s = scoreOf(p, weights);
  const c = denominator === "gap" ? gapOf(p) : p.cost;
  if (c <= 0) return s;
  return (s * 100) / Math.max(c, 1);
}

// Ranking basis: raw benefit, or benefit bought per $100M still unfunded.
function rankValue(p, weights, basis) {
  return basis === "benefit" ? scoreOf(p, weights) : valueIndex(p, weights, "gap");
}

/* Knapsack over the unfunded gap, $5M granularity. */
function selectPortfolio(items, budgetM, weights) {
  const G = 5;
  const B = Math.floor(budgetM / G);
  const costs = items.map((p) => Math.max(1, Math.round(gapOf(p) / G)));
  const vals = items.map((p) => scoreOf(p, weights));
  const dp = new Float64Array(B + 1);
  const keep = [];
  for (let i = 0; i < items.length; i++) {
    const row = new Uint8Array(B + 1);
    const ci = costs[i], vi = vals[i];
    for (let b = B; b >= ci; b--) {
      const cand = dp[b - ci] + vi;
      if (cand > dp[b] + 1e-9) { dp[b] = cand; row[b] = 1; }
    }
    keep.push(row);
  }
  let b = B;
  const chosen = new Set();
  for (let i = items.length - 1; i >= 0; i--) {
    if (keep[i][b]) { chosen.add(items[i].id); b -= costs[i]; }
  }
  return { chosen, total: dp[B] };
}

function Ribbon({ project, height = 6 }) {
  const total = project.cost || 1;
  const done = project.phase === "Complete" ? project.funded : 0;
  const funded = project.funded - done;
  const gap = gapOf(project);
  const seg = (v, color, title) =>
    v <= 0 ? null : (
      <span
        style={{ width: (v / total) * 100 + "%", background: color, height }}
        title={title}
      />
    );
  return (
    <span className="ribbon" style={{ height }}>
      {seg(done, "#06403C", "Complete")}
      {seg(funded, "#17968B", "Funded")}
      {seg(gap, "#C2DAD5", "Gap")}
    </span>
  );
}

function Stat({ label, value, sub }) {
  return (

      <div className="stat-label">{label}</div>
      <div className="stat-value">{value}</div>
      {sub && <div className="stat-sub">{sub}</div>}

  );
}

function Tag({ children, tone }) {
  return <span className="tag" style={{ borderColor: tone, color: tone }}>{children}</span>;
}

function Scoring({ weights, setWeights, denominator, setDenominator, tops, onOpen, baseRanks }) {
  const total = Object.values(weights).reduce((a, b) => a + b, 0);
  const ordered = [...tops].sort(
    (a, b) => rankValue(b, weights, denominator) - rankValue(a, weights, denominator)
  );

  const stress = useMemo(() => {
    const counts = {};
    const N = 120;
    for (let r = 0; r < N; r++) {
      const w = {};
      CRITERIA.forEach((c) => {
        w[c.key] = Math.max(0, weights[c.key] + (Math.random() * 20 - 10));
      });
      const top10 = [...tops]
        .sort((a, b) => rankValue(b, w, denominator) - rankValue(a, w, denominator))
        .slice(0, 10);
      top10.forEach((p) => { counts[p.id] = (counts[p.id] || 0) + 1; });
    }
    const out = {};
    Object.keys(counts).forEach((k) => { out[k] = counts[k] / N; });
    return out;
  }, [weights, tops, denominator]);

  return (

function Optimizer({ tops, weights, onOpen }) {
  const candidates = useMemo(
    () => tops.filter((p) => gapOf(p) > 0 && p.phase !== "Study"),
    [tops]
  );
  const maxGap = candidates.reduce((a, p) => a + gapOf(p), 0);
  const [budget, setBudget] = useState(1500);
  const [balance, setBalance] = useState(false);
  const [locked, setLocked] = useState(() => new Set());
  const [excluded, setExcluded] = useState(() => new Set());

  const run = useCallback(
    (b) => {
      const pool = candidates.filter((p) => !excluded.has(p.id) && !locked.has(p.id));
      const lockCost = candidates
        .filter((p) => locked.has(p.id))
        .reduce((a, p) => a + gapOf(p), 0);
      let remaining = Math.max(0, b - lockCost);
      const chosen = new Set(locked);
      if (!balance) {
        const r = selectPortfolio(pool, remaining, weights);
        r.chosen.forEach((id) => chosen.add(id));
      } else {
        const mo = pool.filter((p) => p.state === "MO");
        const il = pool.filter((p) => p.state !== "MO");
        const a = selectPortfolio(mo, remaining * 0.5, weights);
        const c = selectPortfolio(il, remaining * 0.5, weights);
        a.chosen.forEach((id) => chosen.add(id));
        c.chosen.forEach((id) => chosen.add(id));
      }
      return chosen;
    },
    [candidates, weights, balance, locked, excluded]
  );

  const chosen = useMemo(() => run(budget), [run, budget]);
  const selected = candidates.filter((p) => chosen.has(p.id));
  const spend = selected.reduce((a, p) => a + gapOf(p), 0);

  const frontier = useMemo(() => {
    const pts = [];
    for (let i = 0; i <= 16; i++) {
      const b = (maxGap / 16) * i;
      const c = run(b);
      const v = candidates
        .filter((p) => c.has(p.id))
        .reduce((a, p) => a + scoreOf(p, weights), 0);
      pts.push({ b, v });
    }
    return pts;
  }, [run, maxGap, candidates, weights]);

  const maxV = Math.max(...frontier.map((p) => p.v), 1);
  const W = 560, H = 170;
  const path = frontier
    .map((p, i) => `${i === 0 ? "M" : "L"} ${(p.b / maxGap) * W} ${H - (p.v / maxV) * H}`)
    .join(" ");
  const cur = { x: (Math.min(budget, maxGap) / maxGap) * W, y: H - (selected.reduce((a, p) => a + scoreOf(p, weights), 0) / maxV) * H };

  const toggleSet = (set, setter, id) => {
    const n = new Set(set);
    n.has(id) ? n.delete(id) : n.add(id);
    setter(n);
  };

  return (
    <div className="screen">
      <header className="screen-head">
        <div className="eyebrow">Scenario</div>
        <h1>Budget scenarios</h1>
        <p className="lede">
          Given an envelope, the tool picks the set of unfunded gaps that buys the
          most scored benefit. Lock a project in when a commitment already exists,
          or exclude one that is not deliverable in the period.
        </p>
      </header>

      <div className="panel">
        <div className="controls">
          <label className="budget">
            <span className="field-label">Advocacy envelope</span>
            <input
              type="range"
              min="0"
              max={Math.round(maxGap)}
              step="25"
              value={budget}
              onChange={(e) => setBudget(Number(e.target.value))}
            />
            <output>{money(budget)}</output>
          </label>
          <label className="check">
            <input type="checkbox" checked={balance} onChange={(e) => setBalance(e.target.checked)} />
            <span>Split the envelope evenly between Missouri and Illinois</span>
          </label>
        </div>

        <div className="frontier">
          <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" role="img" aria-label="Benefit against budget">
            <path d={path} fill="none" stroke="#0E7C72" strokeWidth="2" vectorEffect="non-scaling-stroke" />
            <line x1={cur.x} y1="0" x2={cur.x} y2={H} stroke="#06403C" strokeWidth="1" strokeDasharray="4 4" vectorEffect="non-scaling-stroke" />
            <circle cx={cur.x} cy={cur.y} r="4" fill="#06403C" />
          </svg>
          <div className="frontier-axis">
            <span>{money(0)}</span>
            <span>Benefit purchased as the envelope grows</span>
            <span>{money(maxGap)}</span>
          </div>
        </div>

        <div className="scenario-summary">
          <Stat label="Projects selected" value={selected.length + " of " + candidates.length} />
          <Stat label="Committed in scenario" value={money(spend)} sub={money(budget - spend) + " unspent"} />
          <Stat label="Gap left on the table" value={money(maxGap - spend)} />
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <h2>Selection</h2>
          <span className="panel-note">Sorted by benefit per dollar of gap</span>
        </div>
        <ul className="pick-list">
          {[...candidates]
            .sort((a, b) => valueIndex(b, weights, "gap") - valueIndex(a, weights, "gap"))
            .map((p) => {
              const inSet = chosen.has(p.id);
              return (
                <li key={p.id} className={inSet ? "picked" : ""}>
                  <span className="pick-mark" aria-hidden="true">{inSet ? "\u25CF" : "\u25CB"}</span>
                  <button className="pick-name link" onClick={() => onOpen(p.id)}>{p.name}</button>
                  <span className="pick-num">{money(gapOf(p))}</span>
                  <span className="pick-eff">{valueIndex(p, weights, "gap").toFixed(1)}</span>
                  <span className="pick-actions">
                    <button
                      className={locked.has(p.id) ? "chip on" : "chip"}
                      onClick={() => toggleSet(locked, setLocked, p.id)}
                    >
                      Lock in
                    </button>
                    <button
                      className={excluded.has(p.id) ? "chip on" : "chip"}
                      onClick={() => toggleSet(excluded, setExcluded, p.id)}
                    >
                      Exclude
                    </button>
                  </span>
                </li>
              );
            })}
        </ul>
      </div>
    </div>
  );
}

const MILESTONES = ["Concept", "Study", "Engineering", "Right of way", "Funding secured", "Letting", "Construction", "Open"];

function milestoneIndex(p) {
  switch (p.phase) {
    case "Complete": return 8;
    case "Construction": return 7;
    case "Funded": return 5;
    case "Partial": return 4;
    case "Unfunded": return 2;
    default: return 1;
  }
}

const NAV = [
  { k: "overview", label: "Portfolio" },
  { k: "register", label: "Register" },

function App() {
  const [view, setView] = useState("overview");
  const [openId, setOpenId] = useState(null);
  const [filters, setFilters] = useState({ q: "", mode: "", state: "", phase: "" });
  const [denominator, setDenominator] = useState("benefit");
  const [weights, setWeights] = useState(() => {
    const w = {};
    CRITERIA.forEach((c) => { w[c.key] = c.w; });
    return w;
  });

  const baseWeights = useMemo(() => {
    const w = {};
    CRITERIA.forEach((c) => { w[c.key] = c.w; });
    return w;
  }, []);

  const tops = useMemo(() => DATA.filter((p) => !p.parent), []);

  const rankMap = (w, basis) => {
    const o = [...tops].sort((a, b) => rankValue(b, w, basis) - rankValue(a, w, basis));
    const m = {};
    o.forEach((p, i) => { m[p.id] = i + 1; });
    return m;
  };
  const ranks = useMemo(() => rankMap(weights, denominator), [weights, denominator, tops]);
  const baseRanks = useMemo(() => rankMap(baseWeights, denominator), [baseWeights, denominator, tops]);

  const filtered = useMemo(() => {
    const q = filters.q.trim().toLowerCase();
    const match = (p) =>
      (!q || p.name.toLowerCase().includes(q) || (p.note || "").toLowerCase().includes(q)) &&
      (!filters.mode || p.mode === filters.mode) &&
      (!filters.state || p.state === filters.state) &&
      (!filters.phase || p.phase === filters.phase);
    const keep = new Set();
    DATA.forEach((p) => {
      if (match(p)) {
        keep.add(p.id);
        if (p.parent) keep.add(p.parent);
      }
    });
    return DATA.filter((p) => keep.has(p.id));
  }, [filters]);

  const open = DATA.find((p) => p.id === openId) || null;
  const kids = open ? DATA.filter((k) => k.parent === open.id) : [];

  return (
    <div className="app">
      <style>{CSS}</style>

      <nav className="rail">
        <div className="brand">
          <span className="brand-mark" aria-hidden="true" />
          <span className="brand-text">
            Regional Freightway
            <em>Priority projects</em>
          </span>
        </div>
        <ul>
          {NAV.map((n) => (
            <li key={n.k}>
              <button className={view === n.k ? "on" : ""} onClick={() => setView(n.k)}>
                {n.label}
              </button>
            </li>
          ))}
        </ul>
        <div className="rail-foot">
          <span>2026 list</span>
          <span>Demo data</span>
        </div>
      </nav>

      <main className="main">
        {view === "overview" && <Overview tops={tops} onOpen={setOpenId} />}
        {view === "register" && (
          <Register
            rows={filtered}
            filters={filters}
            setFilters={setFilters}
            onOpen={setOpenId}
            weights={weights}
            ranks={ranks}
          />
        )}
        {view === "scoring" && (
          <Scoring
            weights={weights}
            setWeights={setWeights}
            denominator={denominator}
            setDenominator={setDenominator}
            tops={tops}
            onOpen={setOpenId}
            baseRanks={baseRanks}
          />
        )}
        {view === "optimizer" && <Optimizer tops={tops} weights={weights} onOpen={setOpenId} />}
        {view === "tracker" && <Tracker tops={tops} onOpen={setOpenId} />}
      </main>

      <Record project={open} kids={kids} weights={weights} onClose={() => setOpenId(null)} onOpen={setOpenId} />
    </div>
  );
}

.main { flex: 1; min-width: 0; }
.screen { max-width: 1080px; padding: 34px 40px 70px; }
.screen-head { margin-bottom: 26px; }
.eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--slate); }
.screen-head h1 { font-family: var(--display); font-size: 34px; font-weight: 600; letter-spacing: -.022em; margin: 4px 0 8px; }
.lede { max-width: 62ch; color: var(--slate); margin: 0; }

/* stats */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 22px; }
.stat { background: var(--panel); padding: 16px 18px; }
.stat-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--slate); }
.stat-value { font-family: var(--mono); font-size: 25px; font-weight: 600; letter-spacing: -.02em; margin-top: 4px; }
.stat-sub { font-size: 12px; color: var(--slate); margin-top: 2px; }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); padding: 18px 20px 20px; margin-bottom: 20px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font-family: var(--display); font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.panel-note { font-size: 12px; color: var(--slate); }
.two-col { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr); gap: 20px; align-items: start; }

/* ribbon */
.ribbon { display: flex; width: 100%; background: var(--pale); }
.ribbon span { display: block; }

/* overview */
.mode-grid { display: flex; flex-direction: column; gap: 9px; }
.mode-row { display: grid; grid-template-columns: 54px 1fr 78px; align-items: center; gap: 12px; }
.mode-name { font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--slate); }
.mode-bar { display: flex; height: 16px; background: var(--wash); }
.mode-fill { height: 100%; }
.mode-val { font-family: var(--mono); font-size: 13px; text-align: right; }
.split-row { display: flex; gap: 26px; margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--line); }
.split { display: flex; align-items: baseline; gap: 7px; }
.split-key { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--slate); }
.split-val { font-family: var(--mono); font-size: 15px; }
.split-pct { font-size: 12px; color: var(--slate); }

.gap-list { list-style: none; margin: 0; padding: 0; }
.gap-item { width: 100%; display: grid; grid-template-columns: 1fr 150px 84px; align-items: center; gap: 14px; background: none; border: 0; border-bottom: 1px solid #EDEFEC; padding: 9px 0; text-align: left; }
.gap-item:hover { background: #F3F9F7; }
.gap-name { font-size: 13.5px; }
.gap-num { font-family: var(--mono); font-size: 13px; text-align: right; color: var(--rust); }

/* filters */
.filters { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
.filters label { display: flex; flex-direction: column; gap: 4px; }
.filters span { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); }
.filters input, .filters select { font: inherit; padding: 6px 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-width: 148px; }
.ghost { background: none; border: 1px solid var(--line); padding: 7px 12px; color: var(--slate); }
.ghost:hover { border-color: var(--slate); color: var(--ink); }

/* register */
.table-wrap { border: 1px solid var(--line); background: var(--panel); overflow-x: auto; }
table.register { width: 100%; border-collapse: collapse; font-size: 13px; }
.register thead th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.register td { padding: 8px 12px; border-bottom: 1px solid #E4EFEC; vertical-align: middle; }
.register tr:hover td { background: #F3F9F7; }
.register tr.child td.c-name { padding-left: 30px; }
.register tr.child { color: var(--slate); }
.c-num { text-align: right; font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.c-num.gap { color: var(--rust); }
.c-rib { width: 130px; }
.name-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.disc { width: 17px; height: 17px; line-height: 1; border: 1px solid var(--line); background: var(--panel); color: var(--slate); font-family: var(--mono); font-size: 12px; padding: 0; }
.disc-space { width: 17px; }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-align: left; border-bottom: 1px solid transparent; }
.link:hover { color: var(--river); border-bottom-color: var(--river); }
.tag { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; border: 1px solid; padding: 1px 5px; white-space: nowrap; }
.meta { font-family: var(--mono); font-size: 11px; color: var(--slate); }
.empty { padding: 26px 12px; color: var(--slate); text-align: center; }
.legend { display: flex; gap: 16px; margin-top: 10px; font-size: 11.5px; color: var(--slate); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; }

/* scoring */
.weight-row { padding: 10px 0; border-bottom: 1px solid #E4EFEC; }
.weight-top { display: flex; justify-content: space-between; align-items: baseline; }
.weight-top label { font-size: 13px; }
.weight-num { font-family: var(--mono); font-size: 13px; }
.weight-row input[type=range] { width: 100%; accent-color: var(--river); margin: 5px 0 2px; }
.weight-unit { font-size: 11.5px; color: var(--slate); }
.denominator { margin-top: 16px; }
.field-label { display: block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); margin-bottom: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { background: var(--panel); border: 0; padding: 6px 12px; font-size: 12.5px; color: var(--slate); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: #fff; }
.seg.small button { padding: 4px 10px; font-size: 11.5px; }
.hint { font-size: 12px; color: var(--slate); margin: 8px 0 0; max-width: 46ch; }

.rank-list { list-style: none; margin: 0; padding: 0; counter-reset: r; }
.rank-item { width: 100%; display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; background: none; border: 0; border-bottom: 1px solid #E4EFEC; padding: 8px 0; text-align: left; }
.rank-item:hover { background: #F3F9F7; }
.rank-no { font-family: var(--mono); font-size: 12px; color: var(--slate); }
.rank-name { font-size: 13px; }
.rank-meta { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--slate); margin-top: 1px; }
.rank-right { display: flex; align-items: center; gap: 8px; }
.rank-score { font-family: var(--mono); font-size: 13px; }
.move { font-size: 10.5px; font-family: var(--mono); }
.move.up { color: var(--green); }
.move.down { color: var(--rust); }
.fragile { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--river); border: 1px solid var(--river); background: var(--wash); padding: 1px 4px; }

/* optimizer */
.controls { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
.budget { display: grid; grid-template-columns: 1fr 110px; grid-template-areas: "l l" "s o"; gap: 8px 14px; align-items: center; }
.budget .field-label { grid-area: l; margin: 0; }
.budget input { grid-area: s; width: 100%; accent-color: var(--rust); }
.budget output { grid-area: o; font-family: var(--mono); font-size: 19px; text-align: right; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--slate); }
.frontier svg { width: 100%; height: 150px; display: block; background: #F7FBFA; border: 1px solid var(--line); }
.frontier-axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--slate); margin-top: 5px; }
.scenario-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 18px; }

.pick-list { list-style: none; margin: 0; padding: 0; }
.pick-list li { display: grid; grid-template-columns: 16px 1fr 84px 56px 150px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid #E4EFEC; color: var(--slate); }
.pick-list li.picked { color: var(--ink); }
.pick-mark { font-size: 10px; color: var(--pale); }
.pick-list li.picked .pick-mark { color: var(--green); }
.pick-name { font-size: 13px; }
.pick-num, .pick-eff { font-family: var(--mono); font-size: 12.5px; text-align: right; }
.pick-actions { display: flex; gap: 6px; justify-content: flex-end; }
.chip { background: none; border: 1px solid var(--line); padding: 2px 8px; font-size: 11px; color: var(--slate); }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

/* tracker */
.ms-head { display: grid; grid-template-columns: 1fr 300px; }
.ms-head span { display: none; }
.ms-list { list-style: none; margin: 0; padding: 0; }
.ms-list li { display: grid; grid-template-columns: 1fr 190px; gap: 16px; align-items: center; padding: 6px 0; border-bottom: 1px solid #E4EFEC; }
.ms-name { font-size: 13px; }
.ms-track { display: flex; gap: 5px; }
.ms-dot { width: 100%; height: 8px; background: var(--wash); }
.ms-dot.done { background: var(--green); }
table.mini { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.mini td { padding: 7px 0; border-bottom: 1px solid #E4EFEC; vertical-align: top; }
.mini-a { font-weight: 500; }
.mini-b { font-family: var(--mono); font-size: 11.5px; color: var(--slate); width: 74px; }
.mini-c { color: var(--slate); }
.change-list { list-style: none; margin: 0; padding: 0; }
.change-list li { display: grid; grid-template-columns: 44px 68px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid #E4EFEC; }
.change-year { font-family: var(--mono); font-size: 12px; color: var(--slate); }
.change-type { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--river); padding-top: 2px; font-weight: 500; }
.change-body { display: flex; flex-direction: column; font-size: 12.5px; }
.change-body span { color: var(--slate); font-size: 12px; }

/* record drawer */
.scrim { position: fixed; inset: 0; background: rgba(6,48,45,.34); z-index: 20; }
.record {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 92vw); z-index: 21;
  background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 22px 26px 40px;
  animation: slide .22s ease-out;
}
@keyframes slide { from { transform: translateX(18px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .record { animation: none; } }
.record-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
.record-head h2 { font-family: var(--display); font-size: 21px; font-weight: 600; margin: 5px 0 4px; line-height: 1.2; letter-spacing: -.015em; }
.record-sponsor { font-family: var(--mono); font-size: 11.5px; color: var(--slate); }
.close { background: none; border: 0; font-size: 24px; line-height: 1; color: var(--slate); padding: 0 2px; }
.record-figure {
  height: 118px; margin: 18px 0 16px; border: 1px dashed var(--line);
  background: repeating-linear-gradient(135deg, #F2F9F7 0 9px, #E6F1EE 9px 18px);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #86ADA6;
}
.record-money { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 8px; }
.record-money div { display: flex; flex-direction: column; }
.record-money span { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--slate); }
.record-money strong { font-family: var(--mono); font-size: 17px; font-weight: 500; }
.record-money .gap { color: var(--rust); }
.record h3 { font-family: var(--display); font-size: 11px; letter-spacing: .11em; text-transform: uppercase; color: var(--slate); margin: 26px 0 10px; font-weight: 600; }
.score-grid { display: flex; flex-direction: column; gap: 7px; }
.score-row { display: grid; grid-template-columns: 1fr 92px 26px; gap: 10px; align-items: center; font-size: 12.5px; }
.score-bar { height: 7px; background: var(--wash); display: block; }
.score-bar span { display: block; height: 100%; background: var(--river); }
.score-num { font-family: var(--mono); font-size: 11.5px; text-align: right; color: var(--slate); }
.score-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.score-total strong { font-family: var(--mono); font-size: 19px; font-weight: 500; }
.record-ms { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.record-ms li { font-size: 11px; padding: 3px 8px; border: 1px solid var(--line); color: var(--slate); }
.record-ms li.done { background: var(--green); border-color: var(--green); color: #fff; }
.kid-list { list-style: none; margin: 0; padding: 0; }
.kid-list li { display: grid; grid-template-columns: 1fr 74px 62px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid #E4EFEC; font-size: 12.5px; }
.kid-num { font-family: var(--mono); font-size: 11.5px; text-align: right; }
.record-foot { font-size: 11.5px; color: var(--slate); margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); }

/* responsive */
@media (max-width: 900px) {
  .app { flex-direction: column; }
  .rail { width: 100%; flex: none; height: auto; position: static; flex-direction: row; align-items: center; overflow-x: auto; }
  .rail ul { display: flex; }
  .rail li button { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; padding: 12px 14px; }
  .rail li button.on { border-left: 0; border-bottom-color: #4FD5C4; }
  .rail-foot { display: none; }
  .brand { padding: 14px 16px; }
  .screen { padding: 24px 18px 60px; }
  .screen-head h1 { font-size: 29px; }
  .stat-row, .scenario-summary { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
  .pick-list li { grid-template-columns: 16px 1fr 74px; }
  .pick-eff, .pick-actions { display: none; }
  .gap-item { grid-template-columns: 1fr 76px; }
  .gap-item .ribbon { display: none; }
}
`;


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
